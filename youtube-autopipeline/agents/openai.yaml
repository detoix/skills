interface:
  display_name: "YouTube Autopipeline"
  short_description: "Automate YouTube video production in landscape or vertical format"
  default_prompt: "Create a YouTube video from a topic or interview me for the missing inputs, then orchestrate scriptwriting, TTS, presenter lip-sync, B-roll, and final composition. Supports landscape (16:9) and vertical (9:16) formats — specify vertical for Reels, Shorts, or TikTok."
